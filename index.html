<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}

header{display:flex;align-items:center;gap:14px;margin-bottom:6px}header img{height:48px}

a.pick:hover{border-color:var(--ink);border-left-color:var(--teal)}
a.pick b{font-size:22px}a.pick span{color:var(--muted)}
a.old{color:var(--muted);font-size:14px;justify-self:start}
</style>
